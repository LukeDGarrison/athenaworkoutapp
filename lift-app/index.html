<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070709">
<link rel="manifest" href="./manifest.json">
<title>Lift</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070709;
  --surface: #111115;
  --surface-2: #18181d;
  --surface-3: #222229;
  --ink: #f4f4f6;
  --ink-dim: #a1a1aa;
  --mute: #71717a;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);
  --acc: #e11d48;
  --acc-hover: #f43f5e;
  --acc-soft: rgba(225, 29, 72, 0.14);
  --acc-border: rgba(225, 29, 72, 0.35);
  --warm: #f59e0b;
  --warm-soft: rgba(245, 158, 11, 0.14);
  --wt: #38bdf8;
  --radius-lg: 16px;
  --radius-md: 11px;
  --radius-sm: 8px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
}

body {
  padding-top: env(safe-area-inset-top);
}

button, input, textarea, select {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
  transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
}

button:active:not(:disabled) {
  transform: scale(0.97);
}

#app {
  max-width: 580px;
  margin: 0 auto;
  padding: 16px 16px calc(120px + env(safe-area-inset-bottom));
}

/* Typography */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 8px 0 20px;
}

h1 {
  font-size: 26px;
  font-weight: 750;
  letter-spacing: -0.03em;
  margin: 0;
  line-height: 1.2;
}

h2 {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.015em;
  margin: 0;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--mute);
  margin: 22px 0 10px;
}

p {
  margin: 8px 0;
}

.mute {
  color: var(--ink-dim);
  font-size: 13px;
}

.small {
  color: var(--mute);
  font-size: 12px;
}

.num {
  font-variant-numeric: tabular-nums;
}

/* Cards & Layout */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
}

.card.active-banner {
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.14), rgba(17, 17, 21, 0.95));
  border-color: var(--acc-border);
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sp {
  flex: 1;
  min-width: 0;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid transparent;
  background: var(--acc);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 14px;
  line-height: 1.2;
}

.btn:hover:not(:disabled) {
  background: var(--acc-hover);
}

.btn.alt {
  background: var(--acc-soft);
  color: #fb7185;
  border-color: var(--acc-border);
}

.btn.alt:hover:not(:disabled) {
  background: rgba(225, 29, 72, 0.22);
}

.btn.danger {
  background: transparent;
  color: #f87171;
  border-color: rgba(248, 113, 113, 0.25);
}

.btn.danger:hover:not(:disabled) {
  background: rgba(248, 113, 113, 0.1);
}

.btn.ghost {
  background: var(--surface-2);
  color: var(--ink-dim);
  border-color: var(--line);
}

.btn.ghost:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--ink);
}

.btn.sm {
  font-size: 13px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
}

.btn.block {
  width: 100%;
  padding: 13px 16px;
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* Form Elements */
input, textarea, select {
  width: 100%;
  background: var(--surface-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  min-width: 0;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

input::placeholder, textarea::placeholder {
  color: var(--mute);
}

input[type=number] {
  text-align: center;
  padding: 9px 4px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

textarea {
  resize: vertical;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-dim);
  margin: 12px 0 6px;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--acc-soft);
}

/* Navigation */
nav {
  position: fixed;
  z-index: 10;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: rgba(12, 12, 15, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
}

nav button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--mute);
  padding: 6px 2px;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

nav button svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

nav button.on {
  color: var(--acc);
}

/* Stats Grid */
.statgrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px;
}

.stat strong {
  display: block;
  color: var(--ink);
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  margin-bottom: 2px;
}

.stat span {
  font-size: 12px;
  color: var(--mute);
  font-weight: 500;
}

/* Badges & Pills */
.pill {
  display: inline-flex;
  align-items: center;
  border-radius: 99px;
  padding: 4px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-dim);
  white-space: nowrap;
}

.pill.acc {
  background: var(--acc-soft);
  border-color: var(--acc-border);
  color: #fb7185;
}

.inline-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

/* Set Logging Table */
.exercise {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}

.setgrid {
  display: grid;
  grid-template-columns: 34px 1fr 1fr 1fr 38px;
  gap: 6px;
  align-items: center;
  margin-top: 8px;
}

.setgrid.head {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--mute);
  text-align: center;
  margin-top: 14px;
  padding-bottom: 2px;
}

.setgrid.is-done input {
  background: rgba(225, 29, 72, 0.06);
  border-color: rgba(225, 29, 72, 0.2);
  color: var(--ink);
}

.setbadge {
  height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-dim);
  display: flex;
  align-items: center;
  justify-content: center;
}

.setbadge.warm {
  background: var(--warm-soft);
  border-color: rgba(245, 158, 11, 0.35);
  color: var(--warm);
}

.check {
  height: 38px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--mute);
  display: flex;
  align-items: center;
  justify-content: center;
}

.check.done {
  background: var(--acc);
  border-color: var(--acc);
  color: #fff;
}

/* Progress Bar */
.progress {
  height: 6px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
  margin: 10px 0;
}

.progress i {
  display: block;
  height: 100%;
  background: var(--acc);
  border-radius: 99px;
  transition: width 0.25s ease;
}

/* Chips */
.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.chip {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-dim);
  border-radius: 99px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.chip.on {
  background: var(--acc);
  border-color: var(--acc);
  color: #fff;
}

/* Floating Rest Timer */
#timer {
  position: fixed;
  z-index: 9;
  left: 12px;
  right: 12px;
  bottom: calc(68px + env(safe-area-inset-bottom));
  max-width: 556px;
  margin: 0 auto;
  background: rgba(18, 18, 22, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--ink);
  border: 1px solid var(--acc-border);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  display: none;
}

#clock {
  color: var(--ink);
  font-size: 26px;
  font-weight: 750;
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

#timer.running #clock {
  color: var(--acc);
}

.timerbtn {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  background: var(--surface-3);
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.empty {
  padding: 28px 12px;
  text-align: center;
  color: var(--mute);
  font-size: 13px;
}

details summary {
  cursor: pointer;
  list-style: none;
}

details summary::-webkit-details-marker {
  display: none;
}

hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 14px 0;
}

/* Calendar */
.calnav {
  width: 34px;
  height: 34px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.calgrid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
  margin-top: 14px;
}

.calhead {
  font-size: 11px;
  font-weight: 600;
  color: var(--mute);
  text-align: center;
  padding-bottom: 4px;
}

.calday {
  border: 1px solid transparent;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  min-height: 44px;
  padding: 6px 0 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink-dim);
}

.calday.hasw {
  background: var(--acc-soft);
  color: var(--ink);
  font-weight: 650;
}

.calday.today {
  border-color: var(--line-strong);
  color: var(--ink);
}

.calday.sel {
  border-color: var(--acc);
  background: rgba(225, 29, 72, 0.22);
  color: #fff;
}

.dots {
  display: flex;
  gap: 3px;
  height: 6px;
  align-items: center;
}

.dots b {
  display: block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.dots .dw {
  background: var(--acc);
}

.dots .db {
  background: var(--wt);
}

.legend {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--mute);
}

.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend b {
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.legend .dw {
  background: var(--acc);
}

.legend .db {
  background: var(--wt);
}

.last-time {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--ink-dim);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

/* Workout plans */
.plan {
  border: 1px solid var(--acc-border);
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.07), rgba(17, 17, 21, 0.6));
  border-radius: var(--radius-lg);
  padding: 14px 12px 2px;
  margin-bottom: 14px;
}

.plan > .row {
  padding: 0 4px 12px;
}

.plan .card {
  margin-bottom: 10px;
}

.plan-toggle {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex: 1;
  min-width: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.plan-chevron {
  flex: none;
  margin-top: 3px;
  opacity: 0.7;
  transition: transform 0.15s ease;
}

.plan.collapsed .plan-chevron {
  transform: rotate(-90deg);
}


/* Muscle diagram */
.muscle-map { margin-top: 10px; }
.mm-head { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.mflip { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-3); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--ink); }
.mflip svg { flex: none; }
.mm-body { display: flex; gap: 14px; align-items: center; }
.mm-fig { flex: 0 0 50%; max-width: 210px; }
.mfig { width: 100%; height: auto; display: block; }
.muscle-map[data-side="front"] .mfig.back,
.muscle-map[data-side="back"] .mfig.front { display: none; }
.mreg { stroke: var(--surface); stroke-width: 1.6; stroke-linejoin: round; }
.mm-legend { flex: 1; min-width: 0; }
.mgroup + .mgroup { margin-top: 16px; }
.mgroup h4 { display: flex; align-items: center; gap: 7px; margin: 0 0 8px; font-size: 15px; font-weight: 700; color: var(--ink); }
.mdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12px; font-weight: 600; color: var(--ink); }
.mchip i { font-style: normal; color: var(--mute); margin-left: 5px; }

@media (min-width: 560px) {
  .statgrid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
</style>

// Earlier defaults, used to spot built-ins you never retagged: the original single tag and the version 6 tags.
const BUILT_IN_ORIGINAL = new Map(
  BUILT_IN_EXERCISES.map(item => [item.name.toLowerCase(), [item.muscle]])
);
const BUILT_IN_V6_TAGS = new Map(
  BUILT_IN_EXERCISES.map(item => [item.name.toLowerCase(), [item.muscle, ...(BUILT_IN_EXTRA[item.name] || [])]])
);
// Current default tags.
const BUILT_IN_MUSCLE_MAP = new Map(
  BUILT_IN_EXERCISES.map(item => [
    item.name.toLowerCase(),
    [...(BUILT_IN_TAG_OVERRIDES[item.name] || BUILT_IN_V6_TAGS.get(item.name.toLowerCase()))]
  ])
);

// Muscle groups are tags. Every exercise carries a list of them.
const cleanMuscles = m => {
  const list = (Array.isArray(m) ? m : (m ? [m] : []))
    .map(x => String(x))
    .filter(x => MUSCLES.includes(x));
  const uniq = [...new Set(list)];
  const tags = uniq.length > 1 ? uniq.filter(x => x !== 'Other') : uniq;
  return tags.length ? tags : ['Other'];
};
// Reads tags from new data (muscles array) or from older backups (single muscle string).
const readMuscles = o => cleanMuscles(o && (Array.isArray(o.muscles) ? o.muscles : o.muscle));
const onlyOther = m => m.length === 1 && m[0] === 'Other';
const toggleTag = (list, m) => {
  if (m === 'Other') return ['Other'];
  return cleanMuscles(list.includes(m) ? list.filter(x => x !== m) : [...list, m]);
};
const tagPills = m => cleanMuscles(m).map(x =>
  `<span class="pill acc" style="padding:2px 8px;font-size:10px">${esc(x)}</span>`
).join('');

const defaults = () => ({
  version:7,
  exercises:BUILT_IN_EXERCISES.map(item=>({id:uid(),name:item.name,muscles:[...BUILT_IN_MUSCLE_MAP.get(item.name.toLowerCase())],custom:false})),
  workouts:[],
  sessions:[],
  active:null,
  editingSessionId:null,
  editingSession:null,
  timerEnd:null,
  rest:[60,90,120,180],
  restSel:90,
  bodyweight:[],
  defaultSets:3,
  plans:[]
});

function normalize(raw) {
  const d = defaults();
  if (!raw || typeof raw !== 'object') return d;
  d.exercises=[];

  const savedDefaultSets = Math.round(Number(raw.defaultSets));
  d.defaultSets = savedDefaultSets >= 1 && savedDefaultSets <= 20 ? savedDefaultSets : 3;

  d.workouts = Array.isArray(raw.workouts)
    ? raw.workouts.filter(Boolean).map(w => ({
        id:String(w.id || uid()),
        name:String(w.name || ''),
        desc:String(w.desc || ''),
        ex:Array.isArray(w.ex) ? w.ex.filter(Boolean).map(e => ({
          id:String(e.id || uid()),
          libraryId:String(e.libraryId || ''),
          name:String(e.name || ''),
          desc:String(e.desc || ''),
          muscles:readMuscles(e),
          target:String(e.target || '8-12'),
          sets:Math.max(1,Math.min(20,Number(e.sets)||d.defaultSets))
        })) : []
      })) : [];

  const planned = new Set();
  d.plans = Array.isArray(raw.plans)
    ? raw.plans.filter(Boolean).map(p => ({
        id:String(p.id || uid()),
        name:String(p.name || ''),
        desc:String(p.desc || ''),
        collapsed:!!p.collapsed,
        workoutIds:(Array.isArray(p.workoutIds) ? p.workoutIds : []).map(String).filter(id => {
          if (planned.has(id) || !d.workouts.some(w => w.id === id)) return false;
          planned.add(id);
          return true;
        })
      }))
    : [];

  const libraryByName = new Map();
  const addLibraryItem = (name, muscles=null, custom=false, id=null) => {
    const cleanName=String(name||'').trim();
    if(!cleanName) return null;
    const key=cleanName.toLowerCase();
    const given = cleanMuscles(muscles);
    const resolvedMuscles = !onlyOther(given)
      ? given
      : [...(BUILT_IN_MUSCLE_MAP.get(key) || given)];
    if(libraryByName.has(key)) {
      const existing = libraryByName.get(key);
      if (onlyOther(existing.muscles) && !onlyOther(resolvedMuscles)) {
        existing.muscles = resolvedMuscles;
      }
      return existing;
    }
    const item={id:String(id||uid()),name:cleanName,muscles:resolvedMuscles,custom:!!custom};
    libraryByName.set(key,item);
    d.exercises.push(item);
    return item;
  };

  if (Array.isArray(raw.exercises)) {
    for (const e of raw.exercises) {
      if (e && typeof e === 'object') addLibraryItem(e.name, readMuscles(e), !!e.custom, e.id);
    }
  } else {
    for (const item of BUILT_IN_EXERCISES) addLibraryItem(item.name, BUILT_IN_MUSCLE_MAP.get(item.name.toLowerCase()), false);
  }

  for(const w of d.workouts) {
    for(const e of w.ex) {
      const lib=addLibraryItem(e.name, e.muscles, true);
      e.libraryId=lib?.id || '';
      if (onlyOther(e.muscles) && lib && !onlyOther(lib.muscles)) {
        e.muscles = [...lib.muscles];
      }
    }
  }

  // One-time upgrade for data saved before version 7: built-in exercises still on an earlier default
  // get the current default tags. Entries you retagged yourself stay as they are.
  if (!(Number(raw.version) >= 7)) {
    const sameTags = (x, y) => x.length === y.length && x.every(t => y.includes(t));
    const upgrade = item => {
      const key = item.name.trim().toLowerCase();
      const current = BUILT_IN_MUSCLE_MAP.get(key);
      if (!current) return;
      if (sameTags(item.muscles, BUILT_IN_ORIGINAL.get(key)) || sameTags(item.muscles, BUILT_IN_V6_TAGS.get(key))) {
        item.muscles = [...current];
      }
    };
    d.exercises.forEach(upgrade);
    d.workouts.forEach(w => w.ex.forEach(upgrade));
  }

  const cleanExercise = e => ({
    exId:String(e.exId || e.id || uid()),
    name:String(e.name || ''),
    muscles:readMuscles(e),
    note:String(e.note || ''),
    sets:Array.isArray(e.sets) ? e.sets.filter(Boolean).map(s => ({
      w:String(s.w ?? ''),
      r:String(s.r ?? ''),
      rir:String(s.rir ?? ''),
      done:!!s.done,
      warm:!!s.warm
    })) : []
  });

  d.sessions = Array.isArray(raw.sessions)
    ? raw.sessions.filter(Boolean).map(s => ({
        id:String(s.id || uid()),
        wid:String(s.wid || ''),
        name:String(s.name || 'Workout'),
        date:s.date || new Date().toISOString(),
        unfinished:!!s.unfinished,
        note:String(s.note || ''),
        ex:Array.isArray(s.ex) ? s.ex.filter(Boolean).map(cleanExercise) : []
      }))
    : [];

  if (raw.active && typeof raw.active === 'object') {
    const a = raw.active;
    d.active = {
      id:String(a.id || uid()),
      wid:String(a.wid || ''),
      name:String(a.name || 'Workout'),
      date:a.date || new Date().toISOString(),
      note:String(a.note || ''),
      ex:Array.isArray(a.ex) ? a.ex.filter(Boolean).map(cleanExercise) : []
    };
  }

  d.rest = Array.isArray(raw.rest)
    ? raw.rest.map(Number).filter(x=>Number.isFinite(x)&&x>0&&x<=3600).slice(0,8)
    : d.rest;
  if (!d.rest.length) d.rest=[60,90,120,180];

  d.restSel = Number(raw.restSel) || d.rest[0];
  if (!d.rest.includes(d.restSel)) d.restSel=d.rest[0];

  d.timerEnd = Number(raw.timerEnd) || null;
  d.bodyweight = Array.isArray(raw.bodyweight)
    ? raw.bodyweight.filter(x=>x&&Number(x.weight)>0).map(x=>({
        date:x.date || new Date().toISOString(),
        weight:Number(x.weight)
      }))
    : [];

  for (const s of d.sessions) {
    const template=d.workouts.find(w=>w.id===s.wid);
    for (const e of s.ex) {
      const match=template?.ex.find(x=>
        x.name.trim().toLowerCase()===e.name.trim().toLowerCase()
      );
      if (onlyOther(e.muscles) && match) e.muscles=[...match.muscles];
      e.sets=e.sets.map(x=>({...x,warm:!!x.warm}));
    }
  }

  return d;
}

let db;
try {
  const saved=localStorage.getItem('lift.v4') ||
              localStorage.getItem('lift.v3') ||
              localStorage.getItem('lift.v2') ||
              localStorage.getItem('lift.v1');
  db=normalize(saved ? JSON.parse(saved) : null);
} catch(e) {
  db=defaults();
}

let view={t:'workouts'};
let audio=null;

function save() {
  try {
    localStorage.setItem('lift.v4',JSON.stringify(db));
    localStorage.removeItem('lift.v3');
    localStorage.removeItem('lift.v2');
    localStorage.removeItem('lift.v1');
  } catch(e) {
    alert('Storage is full or unavailable. Export a backup before continuing.');
  }
}

function remaining() {
  return db.timerEnd ? Math.max(0,Math.ceil((db.timerEnd-Date.now())/1000)) : 0;
}

function currentWorkout() {
  return db.workouts.find(w=>w.id===view.id);
}

function currentPlan() {
  return db.plans.find(p=>p.id===view.id);
}

function priorExercise(exId,name,wid) {
  const n=(name||'').trim().toLowerCase();
  for(let i=db.sessions.length-1;i>=0;i--) {
    const s=db.sessions[i];
    if(s.wid!==wid || s.unfinished) continue;
    const e=s.ex.find(x=>x.exId===exId ||
      (x.name||'').trim().toLowerCase()===n);
    if(e && e.sets.some(x=>x.done&&!x.warm))
      return e.sets.filter(x=>x.done&&!x.warm);
  }
  return null;
}

function startSession(id) {
  const w=db.workouts.find(x=>x.id===id);
  if(!w) return;

  if(db.active) {
    if(!confirm('A workout is already active. Save it as unfinished and start this one?')) return;
    archiveActive();
  }

  db.active={
    id:uid(),
    wid:w.id,
    name:w.name || 'Workout',
    date:new Date().toISOString(),
    note:'',
    ex:w.ex.map(e=>({
      exId:e.id,
      name:e.name,
      muscles:[...cleanMuscles(e.muscles)],
      note:'',
      sets:Array.from({length:e.sets},()=>blank(false))
    }))
  };

  db.timerEnd=null;
  view={t:'session'};
  save();
}

function archiveActive() {
  if(!db.active) return;
  const a=db.active;
  db.sessions.push({
    ...a,
    unfinished:true,
    ex:a.ex.map(e=>({...e,sets:e.sets.map(s=>({...s}))}))
  });
  db.active=null;
  db.timerEnd=null;
}

function sessionDiffersFromTemplate(a) {
  const template = db.workouts.find(w => w.id === a.wid);
  if(!template) return false;

  if(a.ex.length !== template.ex.length) return true;

  for(let i = 0; i < a.ex.length; i++) {
    if(a.ex[i].name.trim().toLowerCase() !== template.ex[i].name.trim().toLowerCase()) return true;
  }

  for(let i = 0; i < a.ex.length; i++) {
    const sessionWorkSets = a.ex[i].sets.filter(s => !s.warm).length;
    if(sessionWorkSets !== template.ex[i].sets) return true;
  }

  return false;
}

function updateTemplateFromSession(a) {
  const template = db.workouts.find(w => w.id === a.wid);
  if(!template) return;

  template.ex = a.ex.map(se => {
    const match = template.ex.find(te =>
      te.name.trim().toLowerCase() === se.name.trim().toLowerCase()
    );
    const workSets = se.sets.filter(s => !s.warm).length;
    return {
      id: match ? match.id : (se.exId || uid()),
      libraryId: match?.libraryId || db.exercises.find(x=>x.name.toLowerCase()===se.name.trim().toLowerCase())?.id || '',
      name: se.name,
      desc: match ? match.desc : '',
      muscles: [...cleanMuscles(se.muscles || match?.muscles)],
      target: match ? match.target : '8-12',
      sets: Math.max(1, workSets)
    };
  });
}

function finish() {
  const a = db.active;
  if (!a) return;

  const template = db.workouts.find(w => w.id === a.wid);
  const differsFromTemplate = template && sessionDiffersFromTemplate(a);

  const hasInput = a.ex.some(e => e.sets.some(s =>
    s.done || s.w !== '' || s.r !== '' || s.rir !== ''
  ));

  if (!hasInput && !differsFromTemplate) {
    if (!confirm('No workout data was entered. Discard this session?')) return;
    db.active = null;
    db.timerEnd = null;
    view = { t: 'workouts' };
    save();
    render();
    return;
  }

  if (differsFromTemplate) {
    const changed = [];
    if (a.ex.length !== template.ex.length) {
      changed.push(`exercise count (${template.ex.length} → ${a.ex.length})`);
    }
    const newExercises = a.ex.filter(se =>
      !template.ex.some(te => te.name.trim().toLowerCase() === se.name.trim().toLowerCase())
    );
    if (newExercises.length) {
      changed.push(`new exercise${newExercises.length > 1 ? 's' : ''}: ${newExercises.map(e => e.name).join(', ')}`);
    }
    const removedExercises = template.ex.filter(te =>
      !a.ex.some(se => se.name.trim().toLowerCase() === te.name.trim().toLowerCase())
    );
    if (removedExercises.length) {
      changed.push(`removed: ${removedExercises.map(e => e.name).join(', ')}`);
    }

    const msg = `This session differs from the "${template.name}" template.\n\nChanges detected:\n${changed.join('\n')}\n\nUpdate the template to match this session?`;
    if (confirm(msg)) {
      updateTemplateFromSession(a);
    }
  }

  const completed = a.ex.some(e => e.sets.some(s => s.done && !s.warm));
  db.sessions.push({
    ...a,
    unfinished: !completed,
    ex: a.ex.map(e => ({ ...e, sets: e.sets.map(s => ({ ...s })) }))
  });

  db.active = null;
  db.timerEnd = null;
  view = { t: 'history' };
  calReset();
  save();
  render();
}

function saveEditedSession() {
  const es = db.editingSession;
  if(!es) return;

  const idx = db.sessions.findIndex(s => s.id === es.id);
  if(idx !== -1) {
    const completed = es.ex.some(e => e.sets.some(s => s.done && !s.warm));
    db.sessions[idx] = {
      ...es,
      unfinished: !completed,
      ex: es.ex.map(e => ({ ...e, sets: e.sets.map(s => ({ ...s })) }))
    };
  }

  db.editingSession = null;
  db.editingSessionId = null;
  view = { t: 'history' };
  calReset();
  save();
  render();
}

function doneSets(sessions) {
  return sessions.flatMap(s=>s.ex.flatMap(e=>
    e.sets.filter(x=>x.done&&!x.warm)
  ));
}

function volume(sets) {
  return sets.reduce((n,s)=>n+(Number(s.w)||0)*(Number(s.r)||0),0);
}

function estimated1RM(set) {
  const w=Number(set.w)||0;
  const r=Number(set.r)||0;
  if(w<=0 || r<=0) return 0;
  return w*(1+Math.min(r,30)/30);
}

function getPRs() {
  const records={};
  for(const s of db.sessions) {
    if(s.unfinished) continue;
    for(const e of s.ex) {
      for(const set of e.sets) {
        if(!set.done || set.warm) continue;
        const key=e.exId || e.name;
        if(!records[key]) records[key]={
          name:e.name,weight:0,e1rm:0,volume:0,muscles:e.muscles
        };
        const p=records[key];
        p.weight=Math.max(p.weight,Number(set.w)||0);
        p.e1rm=Math.max(p.e1rm,estimated1RM(set));
        p.volume=Math.max(p.volume,(Number(set.w)||0)*(Number(set.r)||0));
      }
    }
  }
  return Object.values(records);
}

// Which side of the body each tag mostly shows on, used to pick the starting view.
const MUSCLE_FRONT = ['Chest','Shoulders','Biceps','Abs','Quads'];
const MUSCLE_BACK = ['Traps','Back','Rear Delts','Triceps','Glutes','Hamstrings'];
let muscleSide = null; // null = pick automatically, 'front' or 'back' once you tap the toggle

function muscleDiagram(exList) {
  const counts = {};
  for (const e of exList || []) {
    const n = Array.isArray(e.sets)
      ? (e.sets.filter(s => !s.warm).length || e.sets.length)
      : Math.max(0, Math.round(Number(e.sets) || 0));
    if (!n) continue;
    for (const m of cleanMuscles(e.muscles)) counts[m] = (counts[m] || 0) + n;
  }

  // Full Body tags have no spot on the figure, so they stay off the diagram entirely.
  const hadTags = Object.keys(counts).length > 0;
  delete counts['Full Body'];

  if (!Object.keys(counts).length) {
    return '<div class="empty" style="padding:14px 6px">' + (hadTags
      ? 'Full body exercises are not shown on the diagram.'
      : 'Add exercises to see which muscle groups this workout trains.') + '</div>';
  }

  const max = Math.max(1, ...Object.values(counts));
  const PRIMARY = '#d92d20', SECONDARY = '#f5c518';
  const isPrimary = c => c >= max * 0.5;
  const fillFor = tag => {
    if (tag === 'sil') return '#4a4e70';
    if (tag === 'hair') return '#272b46';
    const c = counts[tag];
    if (!c) return '#2d3150';
    return isPrimary(c) ? PRIMARY : SECONDARY;
  };

  // Head: face (or back of the skull), ears and a hair silhouette. Drawn last so the chin sits over the neck.
  const head = side => {
    const skin = fillFor('sil'), hair = fillFor('hair');
    const skull = '<path class="mreg" fill="' + skin + '" d="M100 8 C110 8 115.5 16 115.5 26 C115.5 33 113 39 109.5 43 C106.5 46.5 103.5 48.5 100 48.5 C96.5 48.5 93.5 46.5 90.5 43 C87 39 84.5 33 84.5 26 C84.5 16 90 8 100 8 Z"/>';
    const ears = '<ellipse class="mreg" fill="' + skin + '" cx="84" cy="29" rx="2.4" ry="4.6"/><ellipse class="mreg" fill="' + skin + '" cx="116" cy="29" rx="2.4" ry="4.6"/>';
    const hairFront = '<path class="mreg" fill="' + hair + '" d="M84.5 28 C82.5 14 90 4.5 100 4.5 C110 4.5 117.5 14 115.5 28 C114.5 23 112.5 19.5 109.5 17.5 C104 20 97 19.5 92 17 C88.5 19.5 85.5 23 84.5 28 Z"/>';
    const hairBack = '<path class="mreg" fill="' + hair + '" d="M84.5 29 C82.5 14 90 4.5 100 4.5 C110 4.5 117.5 14 115.5 29 C115.5 35 113.5 39 110 41 C106 43 94 43 90 41 C86.5 39 84.5 35 84.5 29 Z"/>';
    const ink = fillFor('hair');
    const smile = '<circle cx="94.5" cy="29" r="1.5" fill="' + ink + '"/><circle cx="105.5" cy="29" r="1.5" fill="' + ink + '"/>' +
      '<path d="M94 35.5 Q100 41.5 106 35.5" fill="none" stroke="' + ink + '" stroke-width="1.5" stroke-linecap="round"/>';
    return side === 'back' ? ears + skull + hairBack : ears + skull + hairFront + smile;
  };

  const fig = (side, list) => {
    const half = list.map(([tag, pts]) =>
      '<polygon class="mreg" fill="' + fillFor(tag) + '" points="' + pts + '"/>'
    ).join('');
    return '<svg class="mfig ' + side + '" viewBox="0 0 200 440" role="img" aria-label="Muscle groups trained, ' + side + ' view">' +
      '<g>' + half + '</g>' +
      '<g transform="translate(200 0) scale(-1 1)">' + half + '</g>' +
      head(side) +
    '</svg>';
  };

  // Starting side: whichever has more trained volume, unless you already picked one.
  const sum = list => list.reduce((s, m) => s + (counts[m] || 0), 0);
  const side = muscleSide || (sum(MUSCLE_BACK) > sum(MUSCLE_FRONT) ? 'back' : 'front');

  // Primary = at least half of the top muscle's sets. Everything else is secondary.
  const all = Object.entries(counts).sort((x, y) => y[1] - x[1]);
  const named = all.filter(([m]) => m !== 'Other');
  const ranked = named.length ? named : all;
  const primary = ranked.filter(([, n]) => n >= max * 0.5);
  const secondary = ranked.filter(([, n]) => n < max * 0.5);
  const chips = list => '<div class="mchips">' + list.map(([m, n]) =>
    '<span class="mchip">' + esc(m) + '<i class="num">' + n + '</i></span>'
  ).join('') + '</div>';
  const group = (title, color, list) => !list.length ? '' :
    '<div class="mgroup"><h4><span class="mdot" style="background:' + color + '"></span>' + title + '</h4>' + chips(list) + '</div>';

  return '<div class="muscle-map" data-side="' + side + '">' +
    '<div class="mm-head"><button type="button" class="mflip" data-a="mside" aria-label="Flip body view">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/><path d="M16 16h5v5"/></svg>Flip' +
    '</button></div>' +
    '<div class="mm-body">' +
      '<div class="mm-fig">' + fig('front', ART_FRONT) + fig('back', ART_BACK) + '</div>' +
      '<div class="mm-legend">' +
        group('Primary', PRIMARY, primary) +
        group('Secondary', SECONDARY, secondary) +
      '</div>' +
    '</div>' +
  '</div>';
}

function dkey(d) {
  const x=new Date(d);
  if(isNaN(x)) return null;
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}

let cal=null;
function calReset() {
  const n=new Date();
  cal={y:n.getFullYear(),m:n.getMonth(),sel:dkey(n)};
}
calReset();

function calIsCurrentMonth() {
  const n=new Date();
  return cal.y===n.getFullYear() && cal.m===n.getMonth();
}

function vCalendar() {
  const byDay={}, wtByDay={};
  for(const s of db.sessions) {
    if(s.unfinished) continue;
    const k=dkey(s.date);
    if(k) (byDay[k]=byDay[k]||[]).push(s);
  }
  for(const x of db.bodyweight) {
    const k=dkey(x.date);
    if(k) (wtByDay[k]=wtByDay[k]||[]).push(x);
  }

  const first=new Date(cal.y,cal.m,1);
  const days=new Date(cal.y,cal.m+1,0).getDate();
  const today=dkey(new Date());
  const prefix=cal.y+'-'+String(cal.m+1).padStart(2,'0')+'-';
  const monthName=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});

  let nW=0,nB=0;
  const cells=[];
  for(let i=0;i<first.getDay();i++) cells.push('<div></div>');

  for(let d=1;d<=days;d++) {
    const k=prefix+String(d).padStart(2,'0');
    const w=byDay[k], b=wtByDay[k];
    if(w) nW+=w.length;
    if(b) nB+=b.length;
    const cls='calday'+(w?' hasw':'')+(k===today?' today':'')+(k===cal.sel?' sel':'');
    const label=new Date(cal.y,cal.m,d).toLocaleDateString(undefined,{month:'long',day:'numeric'})+
      (w?', workout':'')+(b?', weight logged':'');
    cells.push(`<button class="${cls}" data-a="calday" data-k="${k}" aria-label="${esc(label)}">
      <span>${d}</span>
      <span class="dots">${w?'<b class="dw"></b>':''}${b?'<b class="db"></b>':''}</span>
    </button>`);
  }

  let detail='<div class="small" style="margin-top:12px">Tap a day to inspect logged activity.</div>';
  if(cal.sel) {
    const [y,m,d]=cal.sel.split('-').map(Number);
    const ws=byDay[cal.sel]||[];
    const bs=wtByDay[cal.sel]||[];
    detail=`<hr>
      <div class="small" style="font-weight:600;color:var(--ink)">${esc(dateLabel(new Date(y,m-1,d)))}</div>
      ${ws.map(s=>{
        const ds=doneSets([s]);
        return `<div class="exercise" style="padding-bottom:4px"><b>${esc(s.name)}</b>
          <div class="small num">${ds.length} working sets · ${Math.round(volume(ds)).toLocaleString()} lb·reps</div></div>`;
      }).join('')}
      ${bs.map(x=>`
        <div class="row exercise" style="padding-bottom:4px"><span class="small">Bodyweight${(()=>{
          const t=new Date(x.date);
          return isNaN(t)?'':' · '+t.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
        })()}</span><span class="sp"></span><b class="num">${x.weight} lb</b></div>`).join('')}
      ${!ws.length&&!bs.length?'<div class="small" style="margin-top:6px">No activity logged on this date.</div>':''}`;
  }

  return `<div class="card" id="cal">
    <div class="row">
      <button class="btn ghost calnav" data-a="calprev" aria-label="Previous month">${ICONS.back}</button>
      <div class="sp" style="text-align:center">
        <h2>${esc(monthName)}</h2>
        <div class="small num">${nW} workout${nW===1?'':'s'} · ${nB} weigh-in${nB===1?'':'s'}</div>
      </div>
      <button class="btn ghost calnav" data-a="calnext" aria-label="Next month" ${calIsCurrentMonth()?'disabled':''}>${ICONS.next}</button>
    </div>
    ${calIsCurrentMonth()?'':'<div style="text-align:center;margin-top:10px"><button class="btn sm ghost" data-a="caltoday">Today</button></div>'}
    <div class="calgrid">
      ${['S','M','T','W','T','F','S'].map(x=>`<div class="calhead">${x}</div>`).join('')}
      ${cells.join('')}
    </div>
    <div class="legend">
      <span><b class="dw"></b>Workout</span>
      <span><b class="db"></b>Bodyweight</span>
    </div>
    ${detail}
  </div>`;
}

function vHistory() {
  const sessions=db.sessions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const completed=sessions.filter(s=>!s.unfinished);
  const week=completed.filter(s=>Date.now()-new Date(s.date).getTime()<7*86400000);
  // Average workouts per week over the last 4 weeks. If the first workout is newer than that,
  // the average spans only the time since then (at least 1 week) so new users are not undercounted.
  const nowMs=Date.now();
  const last4w=completed.filter(s=>nowMs-new Date(s.date).getTime()<28*86400000);
  const firstMs=completed.reduce((m,s)=>{const t=new Date(s.date).getTime();return isNaN(t)?m:Math.min(m,t);},Infinity);
  const spanDays=completed.length?Math.min(28,Math.max(7,(nowMs-firstMs)/86400000)):28;
  const perWeek=last4w.length/(spanDays/7);
  const weekSets=doneSets(week);
  const weekVolume=volume(weekSets);

  // Every muscle tag on an exercise gets credit for each working set. Muscles with zero sets are left out.
  const muscleVolume={};
  for(const s of week) {
    for(const e of s.ex) {
      const n=e.sets.filter(x=>x.done&&!x.warm).length;
      if(!n) continue;
      for(const m of cleanMuscles(e.muscles)) {
        muscleVolume[m]=(muscleVolume[m]||0)+n;
      }
    }
  }

  const prs=getPRs().sort((a,b)=>b.e1rm-a.e1rm);

  return `<div class="page-header"><h1>Progress</h1></div>
    <div class="statgrid">
      <div class="stat"><strong>${completed.length}</strong><span>Workouts (total)</span></div>
      <div class="stat"><strong>${perWeek.toFixed(1)}</strong><span>Workouts / week (4w)</span></div>
      <div class="stat"><strong>${weekSets.length}</strong><span>Working sets (7d)</span></div>
      <div class="stat"><strong>${Math.round(weekVolume).toLocaleString()}</strong><span>Volume (lb, 7d)</span></div>
    </div>

    <div style="margin-top:12px">${vCalendar()}</div>

    <div class="card">
      <h2>Personal records</h2>
      ${prs.length?prs.map(p=>`
        <div class="row exercise">
          <div class="sp">
            <b>${esc(p.name)}</b>
            <div class="small">${esc(cleanMuscles(p.muscles).join(', '))}</div>
          </div>
          <div style="text-align:right">
            <b class="num">${p.weight} lb</b>
            <div class="small num">Est. 1RM ${p.e1rm.toFixed(1)}</div>
          </div>
        </div>`).join(''):'<div class="empty">Complete working sets to establish personal records.</div>'}
    </div>

    <div class="card">
      <h2>Weekly muscle volume</h2>
      <div class="small">Working sets completed in the past 7 days</div>
      ${Object.entries(muscleVolume).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`
        <div style="margin-top:14px">
          <div class="row"><span style="font-weight:600;font-size:13px">${esc(m)}</span><span class="sp"></span><span class="small num">${n} sets</span></div>
          <div class="progress" style="margin-bottom:0"><i style="width:${Math.min(100,n/Math.max(1,...Object.values(muscleVolume))*100)}%"></i></div>
        </div>`).join('')||'<div class="empty">No completed training data in the last 7 days.</div>'}
    </div>

    <div class="card">
      <h2>Bodyweight</h2>
      <form id="weightform" class="row" style="margin-top:12px">
        <input name="weight" type="number" inputmode="decimal" min="1" step=".1" placeholder="Weight (lb)" required>
        <button class="btn sm" type="submit">Log</button>
      </form>
      ${db.bodyweight.slice().reverse().slice(0,12).map(x=>`
        <div class="row exercise"><span class="mute">${esc(dateLabel(x.date))}</span><span class="sp"></span><b class="num">${x.weight} lb</b></div>
      `).join('')||'<div class="empty">No bodyweight entries logged.</div>'}
    </div>

    <div class="section-label">Session History (${sessions.length})</div>
    ${sessions.map(s=>`
      <details class="card">
        <summary>
          <div class="row">
            <div class="sp">
              <b>${esc(s.name)}</b>
              <div class="small" style="margin-top:2px">${esc(dateLabel(s.date))} · ${s.ex.length} exercises</div>
            </div>
            <span class="pill ${s.unfinished?'':'acc'}">${s.unfinished?'Unfinished':'Completed'}</span>
          </div>
        </summary>
        ${s.note?`<p class="mute" style="margin-top:10px">${esc(s.note)}</p>`:''}
        ${s.ex.map(e=>`
          <div class="exercise">
            <b>${esc(e.name)}</b> <span class="small">· ${esc(cleanMuscles(e.muscles).join(', '))}</span>
            ${e.note?`<div class="mute" style="margin-top:4px">${esc(e.note)}</div>`:''}
            ${e.sets.map((x,i)=>`
              <div class="small num" style="margin-top:3px">${x.warm?'Warm-up':'Set '+(i+1)}: ${esc(x.w||'—')} lb × ${esc(x.r||'—')} ${x.done?'':'(skipped)'}</div>
            `).join('')}
          </div>`).join('')}
        <div class="inline-actions" style="margin-top:12px">
          <button type="button" class="btn sm ghost" data-a="editses" data-id="${s.id}">Edit session</button>
          <button type="button" class="btn sm danger" data-a="delses" data-id="${s.id}">Delete session</button>
        </div>
      </details>
    `).join('')||'<div class="card empty">No workout history yet.</div>'}`;
}

function render() {
  const t=view.t;
  $('#app').innerHTML=
    t==='edit'?vEdit():
    t==='planedit'?vPlanEdit():
    t==='session'?vSession():
    t==='addexsess'?vAddEx():
    t==='library'?vLibrary():
    t==='libraryedit'?vLibraryEdit():
    t==='picktemplate'?vLibraryPicker():
    t==='editsess'?vEditsess():
    t==='history'?vHistory():
    t==='settings'?vSettings():
    vWorkouts();

  const tab=(t==='edit'||t==='planedit'||t==='session'||t==='editsess'||t==='picktemplate')?'workouts':t==='libraryedit'?'library':t;
  document.querySelectorAll('nav button').forEach(b=>
    b.classList.toggle('on',b.dataset.go===tab)
  );
  drawTimer();
}

function drawTimer() {
  const el=$('#timer');
  const app=$('#app');
  if(!db.active&&!db.timerEnd) {
    el.style.display='none';
    app.style.paddingBottom='';
    return;
  }
  el.style.display='block';
  el.classList.toggle('running', !!db.timerEnd);
  el.innerHTML=`
    <div class="row">
      <div>
        <div id="clock">${db.timerEnd?fmt(remaining()):fmt(db.restSel)}</div>
        <div class="small">${db.timerEnd?'Resting':'Ready for next set'}</div>
      </div>
      <span class="sp"></span>
      ${db.timerEnd?`
        <button class="timerbtn" data-a="tm" data-d="-15">−15s</button>
        <button class="timerbtn" data-a="tm" data-d="15">+15s</button>
        <button class="btn sm" data-a="skip">Skip</button>`:''}
    </div>
    <div class="chips">
      ${db.rest.map(s=>`
        <button class="chip ${s===db.restSel?'on':''}" data-a="rest" data-s="${s}">${fmt(s)}</button>
      `).join('')}
    </div>`;
  app.style.paddingBottom='calc('+(el.offsetHeight+76+24)+'px + env(safe-area-inset-bottom))';
}

function startTimer(sec) {
  db.restSel=sec;
  db.timerEnd=Date.now()+sec*1000;
  save();
  drawTimer();
  try {
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    audio.resume();
  } catch(e) {}
}

// One short bell-like ding. A quiet octave overtone gives it a bit of ring.
function ding(t) {
  for(const [freq,peak] of [[1046.5,.3],[2093,.07]]) {
    const o=audio.createOscillator();
    const g=audio.createGain();
    o.type='sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+.005);
    g.gain.exponentialRampToValueAtTime(.0001,t+.25);
    o.connect(g);
    g.connect(audio.destination);
    o.start(t);
    o.stop(t+.3);
  }
}

// Three dings in quick succession when the rest timer ends.
function beep() {
  try {
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    const play=()=>{
      const t=audio.currentTime+.02;
      for(let i=0;i<3;i++) ding(t+i*.16);
    };
    if(audio.state==='running') {
      play();
    } else {
      const p=audio.resume();
      if(p && p.then) p.then(play).catch(()=>{});
      else play();
    }
  } catch(e) {}
  if(navigator.vibrate) navigator.vibrate([90,70,90,70,90]);
}

async function exportData() {
  const data=JSON.stringify({...db,version:7},null,2);
  const file=new File([data],
    'lift-backup-'+new Date().toISOString().slice(0,10)+'.json',
    {type:'application/json'}
  );

  if(navigator.canShare && navigator.canShare({files:[file]})) {
    try {
      await navigator.share({files:[file]});
      return;
    } catch(e) {
      if(e.name==='AbortError') return;
    }
  }

  const url=URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=url;
  a.download=file.name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function toggleTagChip(btn) {
  const box=btn && btn.closest('[data-tags]');
  if(!box) return;
  const chips=[...box.querySelectorAll('.chip')];
  const cur=chips.filter(c=>c.classList.contains('on')).map(c=>c.dataset.m);
  const next=toggleTag(cur,btn.dataset.m);
  chips.forEach(c=>c.classList.toggle('on',next.includes(c.dataset.m)));
}

function pickedTags(sel) {
  const box=$(sel);
  return cleanMuscles(box ? [...box.querySelectorAll('.chip.on')].map(c=>c.dataset.m) : []);
}

function act(a,d,event) {
  if(event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const w=view.id?currentWorkout():null;
  const sess=db.active;
  const es=db.editingSession;

  switch(a) {
    case 'mside': {
      const here = event && event.target.closest ? event.target.closest('.muscle-map') : null;
      muscleSide = (here ? here.dataset.side : muscleSide) === 'back' ? 'front' : 'back';
      document.querySelectorAll('.muscle-map').forEach(el => { el.dataset.side = muscleSide; });
      return;
    }

    case 'go':
      view={t:d.go};
      if(d.go==='history') calReset();
      break;

    case 'calprev':
    case 'calnext':
    case 'caltoday':
    case 'calday': {
      if(a==='calprev') {
        cal.m--;
        if(cal.m<0){cal.m=11;cal.y--;}
      } else if(a==='calnext') {
        if(calIsCurrentMonth()) return;
        cal.m++;
        if(cal.m>11){cal.m=0;cal.y++;}
      } else if(a==='caltoday') {
        calReset();
      } else {
        cal.sel=d.k;
      }
      if(a!=='calday' && a!=='caltoday') {
        cal.sel=calIsCurrentMonth()?dkey(new Date()):null;
      }
      const el=$('#cal');
      if(el) el.outerHTML=vCalendar();
      return;
    }

    case 'back':
      view={t:'workouts'};
      break;

    case 'new': {
      const n={id:uid(),name:'',desc:'',ex:[]};
      db.workouts.push(n);
      view={t:'edit',id:n.id};
      break;
    }

    case 'edit':
      view={t:'edit',id:d.id};
      break;

    case 'newplan': {
      const n={id:uid(),name:'',desc:'',collapsed:false,workoutIds:[]};
      db.plans.push(n);
      view={t:'planedit',id:n.id};
      break;
    }

    case 'editplan':
      view={t:'planedit',id:d.id};
      break;

    case 'toggleplan': {
      const p=db.plans.find(x=>x.id===d.id);
      if(p) p.collapsed=!p.collapsed;
      break;
    }

    case 'planback': {
      const p=currentPlan();
      if(p && !p.name.trim() && !p.desc.trim() && !p.workoutIds.length) {
        db.plans=db.plans.filter(x=>x.id!==p.id);
      }
      view={t:'workouts'};
      break;
    }

    case 'planadd': {
      const p=currentPlan();
      if(!p || !db.workouts.some(x=>x.id===d.id)) break;
      db.plans.forEach(x=>{ x.workoutIds=x.workoutIds.filter(id=>id!==d.id); });
      p.workoutIds.push(d.id);
      break;
    }

    case 'planrm': {
      const p=currentPlan();
      if(p) p.workoutIds=p.workoutIds.filter(id=>id!==d.id);
      break;
    }

    case 'planup':
    case 'plandown': {
      const p=currentPlan();
      if(!p) break;
      const i=Number(d.i);
      const j=a==='planup'?i-1:i+1;
      if(j>=0 && j<p.workoutIds.length) [p.workoutIds[i],p.workoutIds[j]]=[p.workoutIds[j],p.workoutIds[i]];
      break;
    }

    case 'delplan': {
      const p=currentPlan();
      if(!p) break;
      if(!confirm('Delete this plan? Its workouts are kept.')) return;
      db.plans=db.plans.filter(x=>x.id!==p.id);
      view={t:'workouts'};
      break;
    }

    case 'editses': {
      const sessionId = String(d.id);
      const target = db.sessions.find(x => String(x.id) === sessionId);
      
      if (target) {
        db.editingSessionId = sessionId;
        db.editingSession = JSON.parse(JSON.stringify(target));
        view = { t: 'editsess' };
      } else {
        console.error('Edit Session Error: Could not find session with ID:', sessionId);
        console.log('Available session IDs:', db.sessions.map(s => s.id));
        alert('Could not find the session to edit. Please refresh and try again.');
      }
      break;
    }

    case 'canceleditsess':
      db.editingSession=null;
      db.editingSessionId=null;
      view={t:'history'};
      break;

    case 'saveeditsess':
      saveEditedSession();
      return;

    case 'duplicate': {
      const src=db.workouts.find(x=>x.id===d.id);
      if(src) {
        const copy={
          ...src,
          id:uid(),
          name:src.name+' (copy)',
          ex:src.ex.map(e=>({...e,id:uid(),muscles:[...cleanMuscles(e.muscles)]}))
        };
        db.workouts.push(copy);
        const plan=db.plans.find(p=>p.workoutIds.includes(src.id));
        if(plan) plan.workoutIds.splice(plan.workoutIds.indexOf(src.id)+1,0,copy.id);
      }
      break;
    }

    case 'library':
      view={t:'library',search:'',muscleFilter:'All'};
      break;

    case 'filtermuscle':
      view={...view,muscleFilter:d.m||'All'};
      break;

    case 'newlibrary':
      view={t:'libraryedit',muscleFilter:view.muscleFilter||'All'};
      break;

    case 'newlibraryfrompicker':
      view={t:'libraryedit',returnTo:'addexsess',muscleFilter:view.muscleFilter||'All'};
      break;

    case 'newlibraryfromtemplate':
      view={t:'libraryedit',returnTo:'picktemplate',id:view.id,muscleFilter:view.muscleFilter||'All'};
      break;

    case 'editlibrary':
      view={t:'libraryedit',exerciseId:d.id,search:view.search||'',muscleFilter:view.muscleFilter||'All'};
      break;

    case 'libraryback':
      view={t:view.returnTo||'library',id:view.id,search:view.search||'',muscleFilter:view.muscleFilter||'All'};
      break;

    case 'savelibrary': {
      const input=$('#libraryname');
      const name=(input?.value||'').trim();
      const muscles=pickedTags('#librarytags');
      if(!name) { alert('Enter an exercise name.'); return; }
      const duplicate=db.exercises.find(x=>x.id!==view.exerciseId&&x.name.toLowerCase()===name.toLowerCase());
      if(duplicate) { alert('That exercise is already in your library.'); return; }
      const existing=db.exercises.find(x=>x.id===view.exerciseId);
      if(existing) {
        const oldName=existing.name;
        existing.name=name;
        existing.muscles=[...muscles];
        for(const workout of db.workouts) for(const entry of workout.ex) {
          if(entry.libraryId===existing.id || entry.name.toLowerCase()===oldName.toLowerCase()) {
            entry.name=name;
            entry.muscles=[...muscles];
          }
        }
        if(db.active) for(const entry of db.active.ex) {
          if(entry.exId===existing.id || entry.name.toLowerCase()===oldName.toLowerCase()) {
            entry.name=name;
            entry.muscles=[...muscles];
          }
        }
      } else db.exercises.push({id:uid(),name,muscles:[...muscles],custom:true});
      const destination=view.returnTo||'library';
      const destinationId=view.id;
      view=destination==='library'
        ? {t:'library',search:view.search||'',muscleFilter:view.muscleFilter||'All'}
        : {t:destination,id:destinationId,search:name,muscleFilter:'All'};
      break;
    }

    case 'deletelibraryitem':
    case 'deletelibrary': {
      const targetId = a === 'deletelibraryitem' ? d.id : view.exerciseId;
      const item=db.exercises.find(x=>x.id===targetId);
      if(!item) return;
      const used=db.workouts.some(x=>x.ex.some(e=>e.libraryId===item.id||e.name.toLowerCase()===item.name.toLowerCase())) || !!db.active?.ex.some(e=>e.exId===item.id||e.name.toLowerCase()===item.name.toLowerCase());
      if(used) { alert('This exercise is currently used in a workout template or active workout. Remove it from those first before deleting it from the library.'); return; }
      if(!confirm(`Delete "${item.name}" from your library? Existing workout history will remain.`)) return;
      db.exercises=db.exercises.filter(x=>x.id!==item.id);
      if(a==='deletelibrary') {
        view={t:'library',search:view.search||'',muscleFilter:view.muscleFilter||'All'};
      }
      break;
    }

    case 'picktemplate':
      view={t:'picktemplate',id:view.id,editingIndex:d.i!==undefined?Number(d.i):null,search:'',muscleFilter:'All'};
      break;

    case 'backedit':
      view={t:'edit',id:view.id};
      break;

    case 'selectlibrarytemplate': {
      const item=db.exercises.find(x=>x.id===d.id);
      if(!item||!w) break;
      const newEntry={id:uid(),libraryId:item.id,name:item.name,desc:'',muscles:[...cleanMuscles(item.muscles)],target:'8-12',sets:db.defaultSets};
      if(view.editingIndex!==null && view.editingIndex!==undefined) {
        w.ex[view.editingIndex]=newEntry;
        view={t:'edit',id:w.id};
      } else {
        w.ex.push(newEntry);
        view={t:'picktemplate',id:w.id,editingIndex:null,search:view.search||'',muscleFilter:view.muscleFilter||'All'};
      }
      break;
    }

    case 'addlibrarysession': {
      const item=db.exercises.find(x=>x.id===d.id);
      if(!item||!sess) break;
      const templateEntry=db.workouts.find(x=>x.id===sess.wid)?.ex.find(x=>x.libraryId===item.id||x.name.toLowerCase()===item.name.toLowerCase());
      sess.ex.push({
        exId:templateEntry?.id||item.id,
        name:item.name,
        muscles:[...cleanMuscles(templateEntry?.muscles || item.muscles)],
        note:'',
        sets:Array.from({length:templateEntry?.sets||db.defaultSets},()=>blank(false))
      });
      view={t:'addexsess',search:view.search||'',muscleFilter:view.muscleFilter||'All'};
      break;
    }

    case 'addex':
      view={t:'picktemplate',id:w.id,search:'',muscleFilter:'All'};
      break;

    case 'tagex': {
      const e=w?.ex[Number(d.i)];
      if(!e) break;
      e.muscles=toggleTag(cleanMuscles(e.muscles),d.m);
      break;
    }

    case 'tagchip':
      toggleTagChip(event && event.target.closest('[data-a]'));
      return;

    case 'defsets':
      db.defaultSets=Math.min(20,Math.max(1,db.defaultSets+Number(d.d)));
      break;

    case 'sets': {
      const e=w.ex[Number(d.i)];
      e.sets=Math.min(20,Math.max(1,e.sets+Number(d.d)));
      break;
    }

    case 'up': {
      const i=Number(d.i);
      if(i>0) [w.ex[i-1],w.ex[i]]=[w.ex[i],w.ex[i-1]];
      break;
    }

    case 'down': {
      const i=Number(d.i);
      if(i<w.ex.length-1) [w.ex[i+1],w.ex[i]]=[w.ex[i],w.ex[i+1]];
      break;
    }

    case 'delex':
      w.ex.splice(Number(d.i),1);
      break;

    case 'delw':
      if(!confirm('Delete this workout template? Existing history will remain.')) return;
      db.workouts=db.workouts.filter(x=>x.id!==w.id);
      db.plans.forEach(p=>{ p.workoutIds=p.workoutIds.filter(id=>id!==w.id); });
      view={t:'workouts'};
      break;

    case 'start':
      startSession(d.id);
      break;

    case 'resume':
      view={t:'session'};
      break;

    case 'chk': {
      const st=sess.ex[Number(d.e)].sets[Number(d.s)];
      st.done=!st.done;
      if(st.done) startTimer(db.restSel);
      else db.timerEnd=null;
      break;
    }

    case 'chkes': {
      const st=es.ex[Number(d.e)].sets[Number(d.s)];
      st.done=!st.done;
      break;
    }

    case 'togglewarm': {
      const st=sess.ex[Number(d.e)].sets[Number(d.s)];
      st.warm=!st.warm;
      break;
    }

    case 'togglewarmes': {
      const st=es.ex[Number(d.e)].sets[Number(d.s)];
      st.warm=!st.warm;
      break;
    }

    case 'addset':
      sess.ex[Number(d.e)].sets.push(blank(false));
      break;

    case 'addsetes':
      es.ex[Number(d.e)].sets.push(blank(false));
      break;

    case 'addwarm':
      sess.ex[Number(d.e)].sets.unshift(blank(true));
      break;

    case 'addwarmes':
      es.ex[Number(d.e)].sets.unshift(blank(true));
      break;

    case 'rmset':
      if(sess.ex[Number(d.e)].sets.length>1) sess.ex[Number(d.e)].sets.pop();
      break;

    case 'rmsetes':
      if(es.ex[Number(d.e)].sets.length>1) es.ex[Number(d.e)].sets.pop();
      break;

    case 'addexsess':
      view={t:'addexsess',search:'',muscleFilter:'All'};
      break;

    case 'backsession':
      view={t:'session'};
      break;

    case 'rmex': {
      const ei = Number(d.e);
      const exName = sess.ex[ei]?.name || 'this exercise';
      if(!confirm(`Remove "${exName}" from this workout?`)) return;
      sess.ex.splice(ei, 1);
      break;
    }

    case 'addtemplateex': {
      let found = null;
      for(const w of db.workouts) {
        const e = w.ex.find(x => x.id === d.id);
        if(e) { found = e; break; }
      }
      if(found) {
        sess.ex.push({
          exId: found.id,
          name: found.name,
          muscles: [...cleanMuscles(found.muscles)],
          note: '',
          sets: Array.from({length: found.sets}, () => blank(false))
        });
        view = {t: 'session'};
      }
      break;
    }

    case 'addcustomex': {
      const nameInput = $('#customexname');
      const setsInput = $('#customexsets');
      const name = nameInput?.value.trim();
      if(!name) {
        alert('Enter an exercise name.');
        return;
      }
      const muscles = pickedTags('#customextags');
      const numSets = Math.max(1, Math.min(20, Number(setsInput?.value) || db.defaultSets));
      let libraryItem=db.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
      if(!libraryItem) {
        libraryItem={id:uid(),name,muscles:[...muscles],custom:true};
        db.exercises.push(libraryItem);
      }
      sess.ex.push({
        exId: libraryItem.id,
        name: libraryItem.name,
        muscles: [...muscles],
        note: '',
        sets: Array.from({length: numSets}, () => blank(false))
      });
      view = {t: 'addexsess', search: view.search || '', muscleFilter: view.muscleFilter || 'All'};
      break;
    }

    case 'finish':
      finish();
      return;

    case 'delses':
      if(!confirm('Delete this workout record?')) return;
      db.sessions=db.sessions.filter(x=>x.id!==d.id);
      break;

    case 'rest':
      if(db.active) startTimer(Number(d.s));
      else db.restSel=Number(d.s);
      break;

    case 'tm':
      if(db.timerEnd) db.timerEnd=Math.max(Date.now()+1000,db.timerEnd+Number(d.d)*1000);
      break;

    case 'skip':
      db.timerEnd=null;
      break;

    case 'export':
      exportData();
      return;

    case 'import':
      $('#imp').click();
      return;

    case 'clear':
      if(!confirm('Permanently delete all Lift data stored on this device? Export a backup first.')) return;
      db=defaults();
      view={t:'workouts'};
      break;
  }

  save();
  render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b) {
    act(b.dataset.a, b.dataset, e);
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  const d=t.dataset;
  const f=d.f;
  if(!f) return;

  if(f==='librarysearch') {
    view.search=t.value;
    const cursor=t.selectionStart;
    render();
    const searchInput=$('[data-f="librarysearch"]');
    if(searchInput) { searchInput.focus(); searchInput.setSelectionRange(cursor,cursor); }
    return;
  }

  if(view.t==='edit') {
    const w=currentWorkout();
    if(!w) return;

    if(f==='name') w.name=t.value;
    if(f==='desc') w.desc=t.value;
    if(f==='exdesc') w.ex[Number(d.i)].desc=t.value;
    if(f==='target') w.ex[Number(d.i)].target=t.value;
  }

  if(view.t==='planedit') {
    const p=currentPlan();
    if(p) {
      if(f==='planname') p.name=t.value;
      if(f==='plandesc') p.desc=t.value;
    }
  }

  if(view.t==='session' && db.active) {
    if(f==='sessionnote') db.active.note=t.value;
    if(f==='exnote') db.active.ex[Number(d.e)].note=t.value;

    if(['w','r','rir'].includes(f)) {
      const set=db.active.ex[Number(d.e)]?.sets[Number(d.s)];
      if(set) set[f]=t.value;
    }
  }

  if(view.t==='editsess' && db.editingSession) {
    const es=db.editingSession;
    if(f==='esname') es.name=t.value;
    if(f==='esnote') es.note=t.value;
    if(f==='esexnote') es.ex[Number(d.e)].note=t.value;

    if(['esw','esr','esrir'].includes(f)) {
      const set=es.ex[Number(d.e)]?.sets[Number(d.s)];
      if(set) {
        const prop=f==='esw'?'w':f==='esr'?'r':'rir';
        set[prop]=t.value;
      }
    }
  }

  save();
});

document.addEventListener('change',e=>{
  const t=e.target;
  const d=t.dataset;

  if(d.f==='rest') {
    const n=t.value.split(',')
      .map(x=>Math.round(Number(x.trim())))
      .filter(x=>Number.isFinite(x)&&x>0&&x<=3600)
      .slice(0,8);

    if(n.length) {
      db.rest=n;
      if(!n.includes(db.restSel)) db.restSel=n[0];
      save();
      render();
    } else {
      alert('Enter at least one timer preset between 1 and 3600 seconds.');
    }
  }

  if(t.id==='imp' && t.files[0]) {
    const reader=new FileReader();

    reader.onload=()=>{
      try {
        const parsed=JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.workouts) || !Array.isArray(parsed.sessions)) {
          throw new Error('Invalid backup');
        }

        if(!confirm('Replace all Lift data on this device with this backup?')) return;

        db=normalize(parsed);
        view={t:db.active?'session':'workouts'};
        save();
        render();
      } catch(err) {
        alert('This file is not a valid Lift backup. Your existing data was not changed.');
      }
      t.value='';
    };

    reader.readAsText(t.files[0]);
  }
});

document.addEventListener('submit',e=>{
  if(e.target.id==='weightform') {
    e.preventDefault();
    const weight=Number(new FormData(e.target).get('weight'));
    if(weight>0) {
      db.bodyweight.push({date:new Date().toISOString(),weight});
      save();
      render();
    }
  }
});

setInterval(()=>{
  if(!db.timerEnd) return;

  if(remaining()<=0) {
    db.timerEnd=null;
    save();
    beep();
    drawTimer();
    return;
  }

  const c=$('#clock');
  if(c) c.textContent=fmt(remaining());
},250);

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) {
    drawTimer();
    if(db.active) save();
  }
});

if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

render();
</script>
</body>
</html>
